[build]
  command = "node scripts/build.mjs"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "zisi"
  included_files = ["node_modules/pdfjs-dist/package.json", "node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs", "node_modules/pdfjs-dist/wasm/**", "node_modules/pdfjs-dist/standard_fonts/**"]

[[redirects]]
  from = "/api/cases"
  to = "/.netlify/functions/cases"
  status = 200

[[redirects]]
  from = "/api/case-state"
  to = "/.netlify/functions/case-state"
  status = 200

[[redirects]]
  from = "/api/case-override"
  to = "/.netlify/functions/case-override"
  status = 200

[[redirects]]
  from = "/api/case-snapshot"
  to = "/.netlify/functions/case-snapshot"
  status = 200

[[redirects]]
  from = "/api/ingest-case"
  to = "/.netlify/functions/ingest-case"
  status = 200

[[redirects]]
  from = "/api/discoveries"
  to = "/.netlify/functions/discoveries"
  status = 200

[[redirects]]
  from = "/api/refresh-discoveries"
  to = "/.netlify/functions/refresh-discoveries"
  status = 200

[[redirects]]
  from = "/api/case-document"
  to = "/.netlify/functions/case-document"
  status = 200

[[redirects]]
  from = "/api/case-record"
  to = "/.netlify/functions/case-record"
  status = 200
